# On every push to main: fetch thumbnails for any new products, commit them, publish site/ to GitHub Pages,
# then email Miranda a recap of any newly added products.
name: Build and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_recap:
        description: "Send a test recap email (5 sample picks)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Fetch thumbnails for new products
        run: npm run thumbs
      - name: Commit new thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site thumbs-missing.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update product thumbnails"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  recap:
    needs: deploy
    if: github.event_name == 'push' || inputs.test_recap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Email recap of new picks
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECAP_TO: ${{ secrets.RECAP_TO }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/email-recap.mjs ${{ inputs.test_recap && '--test' || github.event.before }}
